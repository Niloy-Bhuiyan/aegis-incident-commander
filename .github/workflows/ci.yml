name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend - lint, tests, migrations, evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check aegis tests

      - name: Tests
        run: pytest -q

      - name: Migrations apply and roll back
        env:
          AEGIS_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Evaluation
        env:
          AEGIS_AUTOSTART_SIMULATOR: '0'
        run: python -m aegis.evaluation --out eval_reports/ci.json

      - name: Enforce evaluation thresholds
        run: |
          python - <<'PY'
          import json, sys
          metrics = json.load(open("eval_reports/ci.json"))["metrics"]
          floors = {
              "detection_rate": 1.0,
              "origin_service_accuracy": 1.0,
              "remediation_accuracy": 1.0,
              "recovery_success_rate": 1.0,
              "citation_validity": 1.0,
              "retrieval_hit_rate": 0.6,
          }
          failed = [
              f"{k}: {metrics[k]} < {floor}"
              for k, floor in floors.items()
              if metrics[k] < floor
          ]
          for line in failed:
              print(f"FAIL {line}")
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: backend/eval_reports/ci.json

  frontend:
    name: Frontend - build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e "."

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        working-directory: frontend
        env:
          CI: 'true'
          AEGIS_PYTHON: python
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
